    stroke="#A855F7"
    stroke-opacity="0.65"
    stroke-width="1"/>

  <text
    x="1318"
    y="58"
    text-anchor="end"
    fill="#E2E8F0"
    font-family="monospace"
    font-size="11"
    letter-spacing="3">

    17RKOLA'S / 00

  </text>

  <text
    x="1318"
    y="77"
    text-anchor="end"
    fill="#475569"
    font-family="monospace"
    font-size="8"
    letter-spacing="2">

    EXPERIENCE SYSTEM

  </text>


  <!-- ========================================================= -->
  <!-- BOTTOM FRAME -->
