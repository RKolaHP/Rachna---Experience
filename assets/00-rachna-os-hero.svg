  <line
    x1="70"
    y1="505"
    x2="1330"
    y2="505"
    stroke="#334155"
    stroke-opacity="0.35"
    stroke-width="1"/>


  <!-- ========================================================= -->
  <!-- BOTTOM LEFT CORNER -->
  <!-- ========================================================= -->

  <path
    d="M55 485V505H75"
