<svg
  width="1400"
  height="620"
  viewBox="0 0 1400 620"
  fill="none"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ========================================================= -->
    <!-- BACKGROUND -->
    <!-- ========================================================= -->

    <linearGradient
      id="bg"
      x1="0"
      y1="0"
      x2="1400"
      y2="620"
      gradientUnits="userSpaceOnUse">

      <stop offset="0%" stop-color="#02030A"/>
      <stop offset="42%" stop-color="#09051B"/>
      <stop offset="72%" stop-color="#0B0820"/>
      <stop offset="100%" stop-color="#02040A"/>

    </linearGradient>


    <!-- ========================================================= -->
    <!-- NEON GRADIENT -->
    <!-- ========================================================= -->

    <linearGradient
      id="neon"
      x1="350"
      y1="180"
      x2="1050"
      y2="440"
      gradientUnits="userSpaceOnUse">

      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="72%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#67E8F9"/>

    </linearGradient>


    <!-- ========================================================= -->
    <!-- GRID -->
    <!-- ========================================================= -->

    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse">

      <path
        d="M40 0H0V40"
        stroke="#8B5CF6"
        stroke-opacity="0.075"
        stroke-width="1"/>

    </pattern>


    <pattern
      id="microGrid"
      width="10"
      height="10"
      patternUnits="userSpaceOnUse">

      <path
        d="M10 0H0V10"
        stroke="#22D3EE"
        stroke-opacity="0.025"
        stroke-width="0.5"/>

    </pattern>


    <!-- ========================================================= -->
    <!-- CENTER GLOW -->
    <!-- ========================================================= -->

    <radialGradient id="centerGlow">

      <stop
        offset="0%"
        stop-color="#8B5CF6"
        stop-opacity="0.30"/>

      <stop
        offset="45%"
        stop-color="#22D3EE"
        stop-opacity="0.08"/>

      <stop
        offset="100%"
        stop-color="#02030A"
        stop-opacity="0"/>

    </radialGradient>


    <!-- ========================================================= -->
    <!-- PURPLE GLOW -->
    <!-- ========================================================= -->

    <filter
      id="glowPurple"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%">

      <feGaussianBlur
        stdDeviation="7"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ========================================================= -->
    <!-- CYAN GLOW -->
    <!-- ========================================================= -->

    <filter
      id="glowCyan"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%">

      <feGaussianBlur
        stdDeviation="5"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ========================================================= -->
    <!-- SOFT GLOW -->
    <!-- ========================================================= -->

    <filter
      id="softGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%">

      <feGaussianBlur
        stdDeviation="25"/>

    </filter>


    <!-- ========================================================= -->
    <!-- ARROW -->
    <!-- ========================================================= -->

    <marker
      id="arrow"
      markerWidth="8"
      markerHeight="8"
      refX="6"
      refY="3"
      orient="auto">

      <path
        d="M0 0L6 3L0 6"
        stroke="#22D3EE"
        stroke-width="1"
        fill="none"/>

    </marker>

  </defs>


  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect
    width="1400"
    height="620"
    fill="url(#bg)"/>

  <rect
    width="1400"
    height="620"
    fill="url(#grid)"/>

  <rect
    width="1400"
    height="620"
    fill="url(#microGrid)"/>


  <!-- ========================================================= -->
  <!-- CENTER ATMOSPHERE -->
  <!-- ========================================================= -->

  <ellipse
    cx="700"
    cy="300"
    rx="470"
    ry="245"
    fill="url(#centerGlow)"/>


  <!-- ========================================================= -->
  <!-- TOP FRAME -->
  <!-- ========================================================= -->

  <line
    x1="70"
    y1="72"
    x2="1330"
    y2="72"
    stroke="url(#neon)"
    stroke-opacity="0.35"
    stroke-width="1"/>


  <!-- ========================================================= -->
  <!-- TOP LEFT CORNER -->
  <!-- ========================================================= -->

  <path
    d="M55 105V85H75"
