<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#03040A"/>
<stop offset=".5" stop-color="#10082A"/>
<stop offset="1" stop-color="#03050C"/>
</linearGradient>

<linearGradient id="impact" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#8B5CF6"/>
<stop offset=".5" stop-color="#22D3EE"/>
<stop offset="1" stop-color="#C084FC"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="12"/>
</filter>

<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
<path d="M42 0H0V42" fill="none" stroke="#7C3AED" stroke-opacity=".12"/>
</pattern>
</defs>

<rect width="1400" height="620" fill="url(#bg)"/>
<rect width="1400" height="620" fill="url(#grid)"/>

<text x="70" y="70" fill="#F5F3FF" font-family="Arial" font-size="34" font-weight="700">
IMPACT CONSTELLATION
</text>

<text x="70" y="102" fill="#67E8F9" font-family="Arial" font-size="13" letter-spacing="3">
VERIFIED SIGNALS
</text>

<circle cx="360" cy="300" r="100" fill="#8B5CF6" opacity=".08" filter="url(#glow)"/>
<circle cx="700" cy="190" r="100" fill="#22D3EE" opacity=".08" filter="url(#glow)"/>
<circle cx="1040" cy="330" r="100" fill="#C084FC" opacity=".08" filter="url(#glow)"/>

<g fill="none" stroke="url(#impact)" stroke-opacity=".35" stroke-width="2">
<line x1="360" y1="300" x2="700" y2="190"/>
<line x1="700" y1="190" x2="1040" y2="330"/>
<line x1="360" y1="300" x2="1040" y2="330"/>
</g>

<g fill="#080817" stroke="url(#impact)" stroke-width="3">
<circle cx="360" cy="300" r="82"/>
<circle cx="700" cy="190" r="82"/>
<circle cx="1040" cy="330" r="82"/>
</g>

<g text-anchor="middle" font-family="Arial">

<text x="360" y="295" fill="#F5F3FF" font-size="31" font-weight="700">~87%</text>
<text x="360" y="322" fill="#94A3B8" font-size="11">PREDICTIVE ACCURACY</text>

<text x="700" y="185" fill="#F5F3FF" font-size="31" font-weight="700">~18%</text>
<text x="700" y="212" fill="#94A3B8" font-size="11">LOWER MODEL VARIANCE</text>

<text x="1040" y="325" fill="#F5F3FF" font-size="31" font-weight="700">~22%</text>
<text x="1040" y="352" fill="#94A3B8" font-size="11">MEDICAL IMAGE IoU</text>

</g>

<text x="700" y="540" text-anchor="middle" fill="#CBD5E1" font-family="Arial" font-size="12" letter-spacing="2">
FEATURE ENGINEERING • OPTIMIZATION • VALIDATION • U-NET
</text>

</svg>
