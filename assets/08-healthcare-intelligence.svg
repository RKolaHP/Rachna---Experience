<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#03040A"/>
<stop offset=".5" stop-color="#10082A"/>
<stop offset="1" stop-color="#03050C"/>
</linearGradient>

<linearGradient id="health" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#8B5CF6"/>
<stop offset=".5" stop-color="#22D3EE"/>
<stop offset="1" stop-color="#C084FC"/>
</linearGradient>

<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
<path d="M42 0H0V42" fill="none" stroke="#7C3AED" stroke-opacity=".12"/>
</pattern>
</defs>

<rect width="1400" height="620" fill="url(#bg)"/>
<rect width="1400" height="620" fill="url(#grid)"/>

<text x="70" y="70" fill="#F5F3FF" font-family="Arial" font-size="34" font-weight="700">
HEALTHCARE INTELLIGENCE
</text>

<text x="70" y="102" fill="#67E8F9" font-family="Arial" font-size="13" letter-spacing="3">
DOCUMENTS • DATA • IMAGING
</text>

<circle cx="700" cy="320" r="82" fill="#080817" stroke="url(#health)" stroke-width="3"/>

<text x="700" y="313" text-anchor="middle" fill="#F5F3FF" font-family="Arial" font-size="20" font-weight="700">
CLINICAL
</text>

<text x="700" y="340" text-anchor="middle" fill="#A5B4FC" font-family="Arial" font-size="12">
SIGNAL
</text>

<g stroke="url(#health)" stroke-opacity=".4" stroke-width="2">
<line x1="640" y1="270" x2="310" y2="175"/>
<line x1="700" y1="238" x2="700" y2="130"/>
<line x1="760" y1="270" x2="1090" y2="175"/>
<line x1="760" y1="370" x2="1090" y2="465"/>
<line x1="700" y1="402" x2="700" y2="510"/>
<line x1="640" y1="370" x2="310" y2="465"/>
</g>

<g fill="#22D3EE">
<circle cx="310" cy="175" r="8"/>
<circle cx="700" cy="130" r="8"/>
<circle cx="1090" cy="175" r="8"/>
<circle cx="1090" cy="465" r="8"/>
<circle cx="700" cy="510" r="8"/>
<circle cx="310" cy="465" r="8"/>
</g>

<g text-anchor="middle" fill="#CBD5E1" font-family="Arial" font-size="12" font-weight="600">
<text x="310" y="150">MEDICAL RECORDS</text>
<text x="700" y="105">PRESCRIPTIONS</text>
<text x="1090" y="150">LAB REPORTS</text>
<text x="1090" y="490">MEDICAL IMAGING</text>
