<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#03040A"/>
<stop offset=".5" stop-color="#10082A"/>
<stop offset="1" stop-color="#03050C"/>
</linearGradient>

<linearGradient id="dna" x1="0" y1="0" x2="1" y2="0">
<stop stop-color="#8B5CF6"/>
<stop offset=".5" stop-color="#22D3EE"/>
<stop offset="1" stop-color="#C084FC"/>
</linearGradient>

<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
<path d="M42 0H0V42" fill="none" stroke="#7C3AED" stroke-opacity=".12"/>
</pattern>
</defs>

<rect width="1400" height="620" fill="url(#bg)"/>
<rect width="1400" height="620" fill="url(#grid)"/>

<text x="70" y="70" fill="#F5F3FF" font-family="Arial" font-size="34" font-weight="700">
ENGINEERING DNA
</text>

<text x="70" y="102" fill="#67E8F9" font-family="Arial" font-size="13" letter-spacing="3">
THE STACK AS A CONNECTED SYSTEM
</text>

<g font-family="Arial">

<!-- central spine -->
<path d="M700 130 C590 190 810 250 700 310 C590 370 810 430 700 490"
fill="none" stroke="url(#dna)" stroke-width="4"/>

<g fill="#22D3EE">
<circle cx="700" cy="130" r="8"/>
<circle cx="700" cy="220" r="8"/>
<circle cx="700" cy="310" r="8"/>
<circle cx="700" cy="400" r="8"/>
<circle cx="700" cy="490" r="8"/>
</g>

<g fill="#A5B4FC" font-size="15" font-weight="700">
<text x="180" y="135">FABRIC</text>
<text x="180" y="225">DATA</text>
<text x="180" y="315">ANALYTICS</text>
<text x="180" y="405">AI / ML</text>
<text x="180" y="495">INTELLIGENCE</text>
</g>

<g fill="#CBD5E1" font-size="12">
<text x="350" y="135">OneLake • Lakehouse • Data Factory • Notebooks</text>
<text x="350" y="225">SQL • PySpark • Spark • Delta</text>
<text x="350" y="315">Power BI • Tableau • Excel • KPI</text>
<text x="350" y="405">Python • Scikit-learn • TensorFlow • PyTorch</text>
<text x="350" y="495">NLP • OCR • CNN • U-Net • Computer Vision</text>
</g>

<g stroke="#8B5CF6" stroke-opacity=".4">
<line x1="700" y1="130" x2="300" y2="130"/>
<line x1="700" y1="220" x2="300" y2="220"/>
<line x1="700" y1="310" x2="300" y2="310"/>
<line x1="700" y1="400" x2="300" y2="400"/>
<line x1="700" y1="490" x2="300" y2="490"/>
</g>

</g>

<text x="70" y="575" fill="#64748B" font-family="Arial" font-size="12" letter-spacing="2">
DATA → PLATFORM → MODEL → SIGNAL
</text>

</svg>
