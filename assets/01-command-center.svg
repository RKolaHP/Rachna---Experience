<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#03040A"/>
    <stop offset="50%" stop-color="#10082A"/>
    <stop offset="100%" stop-color="#03050C"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8B5CF6"/>
    <stop offset="50%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#C084FC"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="12"/>
  </filter>

  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#7C3AED" stroke-opacity=".12"/>
  </pattern>
</defs>

<rect width="1400" height="620" fill="url(#bg)"/>
<rect width="1400" height="620" fill="url(#grid)"/>

<circle cx="700" cy="315" r="170" fill="#7C3AED" opacity=".08" filter="url(#glow)"/>
<circle cx="700" cy="315" r="130" fill="none" stroke="url(#line)" stroke-width="2"/>
<circle cx="700" cy="315" r="92" fill="#080817" stroke="#22D3EE" stroke-width="2"/>

<text x="70" y="70" fill="#F5F3FF" font-family="Arial" font-size="38" font-weight="700" letter-spacing="3">
RACHNA.OS
</text>

<text x="70" y="103" fill="#67E8F9" font-family="Arial" font-size="13" letter-spacing="3">
COMMAND CENTER
</text>

<text x="700" y="307" text-anchor="middle" fill="#F5F3FF" font-family="Arial" font-size="27" font-weight="700">
DATA
</text>

<text x="700" y="337" text-anchor="middle" fill="#A5B4FC" font-family="Arial" font-size="15">
→ INTELLIGENCE
</text>

<text x="700" y="363" text-anchor="middle" fill="#67E8F9" font-family="Arial" font-size="15">
→ DECISION
</text>

<!-- connections -->

<g stroke="url(#line)" stroke-opacity=".4" stroke-width="2">
<line x1="700" y1="315" x2="350" y2="170"/>
<line x1="700" y1="315" x2="1050" y2="170"/>
<line x1="700" y1="315" x2="320" y2="465"/>
<line x1="700" y1="315" x2="1080" y2="465"/>
<line x1="700" y1="315" x2="700" y2="120"/>
<line x1="700" y1="315" x2="700" y2="520"/>
</g>

<g fill="#22D3EE">
<circle cx="350" cy="170" r="7"/>
<circle cx="1050" cy="170" r="7"/>
<circle cx="320" cy="465" r="7"/>
<circle cx="1080" cy="465" r="7"/>
<circle cx="700" cy="120" r="7"/>
<circle cx="700" cy="520" r="7"/>
</g>

<g fill="#CBD5E1" font-family="Arial" font-size="13" font-weight="600" text-anchor="middle">
<text x="350" y="145">DATA ENGINEERING</text>
<text x="1050" y="145">AI / ML</text>
<text x="320" y="440">ANALYTICS</text>
<text x="1080" y="440">AUTOMATION</text>
<text x="700" y="95">HEALTHCARE</text>
<text x="700" y="550">RESEARCH</text>
</g>

<text x="70" y="575" fill="#64748B" font-family="Arial" font-size="12" letter-spacing="2">
EXPERIENCE // EVIDENCE // SYSTEMS
</text>

</svg>
