<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#03040A"/>
<stop offset=".5" stop-color="#10082A"/>
<stop offset="1" stop-color="#03050C"/>
</linearGradient>

<linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
<stop stop-color="#8B5CF6"/>
<stop offset=".5" stop-color="#22D3EE"/>
<stop offset="1" stop-color="#C084FC"/>
</linearGradient>

<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
<path d="M42 0H0V42" fill="none" stroke="#7C3AED" stroke-opacity=".12"/>
</pattern>
</defs>

<rect width="1400" height="620" fill="url(#bg)"/>
<rect width="1400" height="620" fill="url(#grid)"/>

