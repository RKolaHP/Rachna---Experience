<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#03040A"/>
<stop offset=".5" stop-color="#10082A"/>
<stop offset="1" stop-color="#03050C"/>
</linearGradient>

<linearGradient id="system" x1="0" y1="0" x2="1" y2="0">
<stop stop-color="#8B5CF6"/>
<stop offset=".5" stop-color="#22D3EE"/>
<stop offset="1" stop-color="#C084FC"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="14"/>
</filter>

<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
<path d="M42 0H0V42" fill="none" stroke="#7C3AED" stroke-opacity=".12"/>
</pattern>
</defs>

<rect width="1400" height="620" fill="url(#bg)"/>
<rect width="1400" height="620" fill="url(#grid)"/>

<text x="70" y="70" fill="#F5F3FF" font-family="Arial" font-size="34" font-weight="700">
SYSTEM STATUS
</text>

<text x="70" y="102" fill="#67E8F9" font-family="Arial" font-size="13" letter-spacing="3">
RACHNA.OS
</text>

<rect x="180" y="165" width="1040" height="290" rx="36"
fill="#070713"
stroke="url(#system)"
stroke-width="2"/>

<circle cx="700" cy="270" r="70" fill="#22D3EE" opacity=".08" filter="url(#glow)"/>
<circle cx="700" cy="270" r="12" fill="#22D3EE"/>

<text x="700" y="345" text-anchor="middle"
fill="#F5F3FF" font-family="Arial" font-size="30" font-weight="700">
SYSTEM EVOLVING
</text>

<text x="700" y="378" text-anchor="middle"
fill="#A5B4FC" font-family="Arial" font-size="13" letter-spacing="2">
DATA → INTELLIGENCE → DECISION
</text>

<g font-family="Arial" text-anchor="middle">

<g fill="#94A3B8" font-size="11">
<text x="350" y="420">DATA</text>
<text x="580" y="420">TRUST</text>
<text x="820" y="420">AI</text>
<text x="1050" y="420">BUILD</text>
</g>

<g fill="#312E81">
<rect x="285" y="435" width="130" height="5" rx="3"/>
<rect x="515" y="435" width="130" height="5" rx="3"/>
<rect x="755" y="435" width="130" height="5" rx="3"/>
<rect x="985" y="435" width="130" height="5" rx="3"/>
</g>

<g fill="url(#system)">
<rect x="285" y="435" width="120" height="5" rx="3"/>
<rect x="515" y="435" width="125" height="5" rx="3"/>
<rect x="755" y="435" width="115" height="5" rx="3"/>
<rect x="985" y="435" width="122" height="5" rx="3"/>
</g>

</g>

<text x="700" y="535" text-anchor="middle"
fill="#67E8F9" font-family="Arial" font-size="14"
font-weight="600" letter-spacing="3">
WHERE CURIOSITY MEETS POSSIBILITY
</text>

<text x="700" y="565" text-anchor="middle"
fill="#475569" font-family="Arial" font-size="10"
letter-spacing="2">
RACHNA.OS // EXPERIENCE // EVIDENCE // EVOLUTION
</text>

</svg>
